syntax = "proto3";

option go_package = "github.com/xoctopus/httpx/internal/payload/transformer/testdata;testdata";

message UserProfile {
  int64 id = 1;
  string name = 2;
  string email = 3;

  repeated string tags = 4;

  UserRole role = 5;
}

enum UserRole {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN = 1;
  ROLE_MEMBER = 2;
}